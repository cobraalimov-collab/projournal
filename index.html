function equityChart(f, title) {

  const tips = [tipCard(T('startLbl'), 0, cap, cap, true), ...f.map((t, i) => tipCard(pairRaw(t.pair), pnl(t), eqs[i + 1], cap, false))];
  return drawLine({title, summary, vals: eqs, base: cap, baseLabel: 'Start ' + usd(cap),

    pill: usd(eqs[n]), tips, dates: f.map(t => t.date)});
}
function emotionChart(f, title) {

/* ===== Monthly AI audit (rule-based, this month only, USD) ===== */
function audit(f) {
  const box = (L, tilt) => `<div class="card audit">${tilt ? `<div class="tilt">${esc(T('tilt'))}</div>` : ''}<b>${esc(T('auditTitle'))}</b><ul>${L.map(([c, s]) => `<li class="${c}">${s}</li>`).join('')}</ul></div>`;
  if (!f.length) return box([['', esc(T('noData'))]], false);
  const L = [];
  const losses = f.filter(t => t.outcome === 'sl');
  if (!losses.length) L.push(['good', esc(T('noLoss'))]);

  const em = {};
  losses.forEach(t => (t.emotions.length ? t.emotions : ['—']).forEach(e => {
    const o = em[e] || (em[e] = {n: 0, p: 0}); o.n++; o.p = r2(o.p + pnl(t));
  }));
  Object.entries(em).sort((a, b) => a[1].p - b[1].p).slice(0, 2)
    .forEach(([e, o]) => L.push(['warn', esc(T('emoLoss')(EMO(e), o.n, fmt(o.p)))]));

  // Win rate per pair: TP / (TP + SL), combining all timeframes of that pair
  const pr = {};
  f.forEach(t => {
    const o = pr[t.pair] || (pr[t.pair] = {w: 0, l: 0, tfs: {}});
    if (t.outcome === 'tp') o.w++;
    if (t.outcome === 'sl') { o.l++; o.tfs[t.tf] = (o.tfs[t.tf] || 0) + 1; }
  });
  const worst = Object.entries(pr).filter(([, o]) => o.l > 0)
    .map(([p, o]) => ({pair: p, wr: o.w / (o.w + o.l) * 100, l: o.l,
      tf: (Object.entries(o.tfs).sort((a, b) => b[1] - a[1])[0] || ['—'])[0] || '—'}))
    .sort((a, b) => a.wr - b.wr || b.l - a.l)[0];
  if (worst) L.push(['warn', esc(T('worst')(pairRaw(worst.pair), worst.tf, worst.wr.toFixed(0)))]);

  const avg = f.reduce((a, t) => a + t.risk, 0) / f.length;
  const hi = f.filter(t => t.risk > avg).length;
  if (hi) L.push(['warn', esc(T('riskHi')(hi, avg.toFixed(2)))]);
  const days = {};
  f.forEach(t => { const d = days[t.date] || (days[t.date] = {r: 0, m: 0}); d.r = t.outcome === 'sl' ? d.r + 1 : 0; d.m = Math.max(d.m, d.r); });
  Object.entries(days).filter(([, d]) => d.m >= 2)
    .forEach(([d, v]) => L.push(['warn', esc(T('revenge')(d, v.m))]));

  const combo = {};
  f.forEach(t => t.emotions.forEach(e => t.strategy.forEach(s => {
    const k = e + '\u0001' + s; combo[k] = r2((combo[k] || 0) + pnl(t));
  })));
  const bc = Object.entries(combo).sort((a, b) => b[1] - a[1])[0];
  if (bc && bc[1] > 0) { const [e, s] = bc[0].split('\u0001'); L.push(['good', esc(T('best')(EMO(e), s, fmt(bc[1])))]); }
  const bp = {};
  f.forEach(t => bp[t.pair] = r2((bp[t.pair] || 0) + pnl(t)));
  const bpE = Object.entries(bp).sort((a, b) => b[1] - a[1])[0];
  if (bpE) L.push([bpE[1] >= 0 ? 'good' : 'warn', esc(T('bestPair')(pairRaw(bpE[0]), fmt(bpE[1])))]);

  // Tilt: 2+ consecutive stop-losses, or any FOMO / Greed trade
  let run = 0, maxRun = 0;
  [...f].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(t => { run = t.outcome === 'sl' ? run + 1 : 0; maxRun = Math.max(maxRun, run); });
  const emoHit = f.filter(t => t.emotions.some(e => /FOMO|Greedy/.test(e))).length;
  return box(L, maxRun >= 2 || emoHit > 0);
}

function traderScore(all, wr, avgRR) {

/* ===== Portfolio banner: all-time % line (#2962FF) + discipline line (#f59e0b), legend, tooltips ===== */
function portfolioPctChart(eqs, cap, sorted, tips, W, H, emoSeries) {
  const showCap = lineVis.cap, showEmo = !!(lineVis.emo && emoSeries);
  const PL = 0, PRX = 0, TOP = 46, BOT = H - 34, BLUE = '#2962FF', AMBER = '#f59e0b', uid = 'p' + (++chartUid);
  const pctOf = v => (cap > 0 ? (v - cap) / cap * 100 : 0);
  const pctFmt = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
  const pct = eqs.map(pctOf), n = pct.length - 1, last = pct[n];
  const nt = niceTicks(Math.min(0, ...pct), Math.max(0, ...pct), 4);
  const X = i => PL + i * (W - PL - PRX) / Math.max(1, n);
  const Y = v => TOP + (nt.hi - v) / ((nt.hi - nt.lo) || 1) * (BOT - TOP);
  const YE = v => TOP + (100 - v) / 100 * (BOT - TOP);
  const pathOf = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const P = pct.map((v, i) => [X(i), Y(v)]);
  const grid = nt.ticks.filter(v => Math.abs(Y(v) - Y(last)) > 16).map(v => `<line x1="${PL}" x2="${W - PRX}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" style="stroke:rgba(255,255,255,0.04)"/>`).join('');
  const leftAxis = showEmo ? [0, 50, 100].map(v => `<text x="${PL - 6}" y="${(YE(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" style="fill:${AMBER};font-variant-numeric:tabular-nums">${v}%</text>`).join('') : '';
  const idxs = n ? [...new Set(Array.from({length: 5}, (_, k) => Math.round((k + 1) * n / 5)))] : [];

  const pw = Math.max(64, pctFmt(last).length * 6.8 + 14), py = Math.min(Math.max(Y(last) - 9, TOP - 2), BOT - 9);

}
/* ===== Emotions chart: named Y levels (negative bottom -> calm top), labelled points, breakdown strip ===== */
const EMO_ORDER = ['FOMO', 'Rushed', 'Greedy', 'Fearful', 'Confident', 'Patient', 'Calm'];
function emoLevels(sorted) {
  const lv = [...EMO_ORDER];
  sorted.forEach(t => (t.emotions || []).forEach(e => { if (!lv.includes(e)) lv.push(e); }));

function emoChart(sorted, W, H) {
  const PL = 0, PRX = 0, TOP = 14, BOT = H - 24, AMBER = '#f59e0b', WHITE = '#ffffff', uid = 'e' + (++chartUid);
  const lv = emoLevels(sorted), L = lv.length, N = sorted.length, plotW = W - PL - PRX;
  const yOf = idx => (L <= 1 ? (TOP + BOT) / 2 : BOT - idx / (L - 1) * (BOT - TOP));
  const xOf = i => (N <= 1 ? PL + plotW / 2 : PL + i * plotW / (N - 1));
  const pts = [];
  sorted.forEach((t, i) => {
    const e = (t.emotions || [])[0];
    if (!e) return;
    pts.push({x: xOf(i), y: yOf(lv.indexOf(e)), name: e,
      tip: `<b>${esc(pairRaw(t.pair))}</b><div>${esc(T('emoLegend'))}: <b>${esc(EMO(e))}</b></div><div>${esc(mmdd(t.date))}</div>`});
  });
  if (!pts.length) return `<div class="emo-empty">${esc(T('noEmo'))}</div>`;
  const sp = N > 1 ? plotW / (N - 1) : plotW;
  const dateEvery = Math.max(1, Math.ceil(44 / Math.max(sp, 1)));
  const grid = lv.map((name, idx) => {
    const y = yOf(idx).toFixed(1);
    return `<line x1="${PL}" x2="${W - PRX}" y1="${y}" y2="${y}" style="stroke:rgba(255,255,255,0.06)"/>` +
      '';
  }).join('');
  const path = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const dots = pts.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${AMBER}"/>`).join('');
  const placed = [];
  const labels = pts.map((p, k) => {
    const ly = p.y - 8 < TOP ? p.y + 14 : p.y - 8;
    const w = EMO(p.name).length * 6.4 + 6;
    const anchor = pts.length > 1 && k === 0 ? 'start' : pts.length > 1 && k === pts.length - 1 ? 'end' : 'middle';
    const x0 = anchor === 'start' ? p.x : anchor === 'end' ? p.x - w : p.x - w / 2;
    const box = {x0, x1: x0 + w, y0: ly - 10, y1: ly + 3};
    if (placed.some(d => d.x0 < box.x1 && d.x1 > box.x0 && d.y0 < box.y1 && d.y1 > box.y0)) return '';
    placed.push(box);
    return `<text x="${p.x.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${anchor}" font-size="10" font-weight="600" fill="${WHITE}">${esc(EMO(p.name))}</text>`;
  }).join('');
  const dates = sorted.map((t, i) => (i % dateEvery === 0 ? `<text x="${xOf(i).toFixed(1)}" y="${H - 19}" text-anchor="${N > 1 && i === 0 ? 'start' : N > 1 && i === N - 1 ? 'end' : 'middle'}" font-size="10" style="fill:var(--mut);font-variant-numeric:tabular-nums">${esc(mmdd(t.date))}</text>` : '')).join('');
  SERIES[uid] = {W, xs: pts.map(p => p.x), ys: pts.map(p => p.y), tips: pts.map(p => p.tip)};
  return `<svg class="eqc" data-sid="${uid}" viewBox="0 0 ${W} ${H}">
    ${grid}
    <path d="${path}" fill="none" stroke="${AMBER}" stroke-width="1.25" stroke-linejoin="miter" stroke-linecap="butt"/>
    ${labels}${dates}
    <line class="xh" x1="0" x2="0" y1="${TOP}" y2="${BOT}" style="display:none;stroke:rgba(255,255,255,0.35);stroke-dasharray:3 3"/>
    <line class="yh" x1="${PL}" x2="${W - PRX}" y1="0" y2="0" style="display:none;stroke:rgba(255,255,255,0.35);stroke-dasharray:3 3"/>
    <circle class="hd" r="4" fill="${AMBER}" stroke="#ffffff" stroke-width="1.5" style="display:none"/>
    <rect x="${PL}" y="${TOP}" width="${plotW}" height="${BOT - TOP}" fill="transparent"/>
  </svg>`;
}

/* ===== Split-screen chart comparison (view only; does not change data) ===== */
// TradingView snapshot (tradingview.com/x/ID/) -> direct PNG; direct image URLs pass through; anything else is an iframe
function snapImage(url) {
  const m = url.match(/tradingview\.com\/x\/([A-Za-z0-9]+)/i);
  if (m) return `https://s3.tradingview.com/${m[1][0].toLowerCase()}/${m[1]}.png`;
  return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url) ? url : null;
}
// Each panel: uploaded/pasted image (stored locally) > TradingView snapshot PNG > TradingView chart widget for the pair
// Preview for regular chart links: webpage screenshot service (external, so it can be blocked in some sandboxes)
const PREVIEW_BASE = 'https://image.thum.io/get/width/1200/crop/800/';
function previewUrl(url) { return snapImage(url) || (PREVIEW_BASE + encodeURIComponent(url)); }
const TV_INTERVAL = {'15m':'15','1H':'60','4H':'240','1D':'D'};
function widgetView(t) {
  const src = 'https://s.tradingview.com/widgetembed/?symbol=' + encodeURIComponent('BINANCE:' + t.pair) +
    '&interval=' + (TV_INTERVAL[t.tf] || '60') + '&theme=dark&style=1&locale=en';
  return `<iframe class="frame" src="${esc(src)}" referrerpolicy="no-referrer-when-downgrade" title="TradingView ${esc(t.pair)}"></iframe>`;
}
function imgView(src) { return `<div class="imgwrap"><img src="${esc(src)}" alt=""></div>`; }
function paneHTML(side, label, t, url) {
  const img = t[side + 'Img'];
  const open = url ? `<a class="open" href="${safeUrl(url)}" target="_blank" rel="noopener">${esc(T('openTv'))}</a>` : '';
  const acts = `<div class="paneact"><button data-cmp="upload" data-side="${side}">${esc(T('upload'))}</button>${img ? `<button data-cmp="clear" data-side="${side}">${esc(T('removeImg'))}</button>` : ''}<span class="hint">${esc(T('clickPanel'))}</span></div>`;
  let view;
  if (img) view = imgView(img);
  else if (!url) view = `<div class="ph">${esc(T('noTv'))}</div>`;
  else if (snapImage(url)) view = `<div class="imgwrap"><img class="snap" src="${esc(snapImage(url))}" alt=""></div>`;
  else view = `<div class="imgwrap"><img class="snap" src="${esc(previewUrl(url))}" alt=""></div>`;
  return `<div class="pane" data-side="${side}"><div class="plabel">${esc(label)}</div>${open}${view}${acts}</div>`;
}
function openCompare(id) {
  const t = trades.find(x => x.id === id); if (!t) return;
  const p = pnl(t);
  cmpId = id; setTarget(null);
  $('#cmpPair').textContent = t.pair;
  $('#cmpSide').innerHTML = `<button class="${t.side}" style="cursor:default">${t.side === 'L' ? esc(T('long')) : esc(T('short'))}</button>`;
  $('#cmpRisk').textContent = t.risk + '%';
  $('#cmpRR').textContent = '1:' + t.rr;
  $('#cmpPnl').innerHTML = `<span class="${p >= 0 ? 'pos' : 'neg'}">${fmt(p)}</span>`;
  $('#cmpBody').innerHTML = paneHTML('before', T('lblBefore'), t, t.beforeChart) + paneHTML('after', T('lblAfter'), t, t.afterChart);
  $('#cmpBody').querySelectorAll('img.snap').forEach(im => im.onerror = () => { im.parentElement.outerHTML = widgetView(t) + '<div class="cnote">' + T('extNote') + '</div>'; });
  $('#cmpBody').querySelectorAll('.imgwrap').forEach(w => w.onclick = () => w.classList.toggle('z'));
  $('#cmp').classList.remove('hidden');
}
function closeCompare() { $('#cmp').classList.add('hidden'); $('#cmpBody').innerHTML = ''; }
let cmpId = null, activeSide = null;
function setTarget(side) {
  activeSide = side;
  $('#cmpTarget').textContent = side ? T('pasteTarget') + side.toUpperCase() : T('clickPanel');
  document.querySelectorAll('#cmp .pane').forEach(p => p.classList.toggle('act', p.dataset.side === side));
}
// Resize to max 1600px and compress to JPEG so images fit in localStorage
function toDataURL(file) {
  return new Promise((res, rej) => {
    const src = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(src); rej(new Error('image')); };
    img.src = src;
  });
}
async function setImg(side, data) {
  const t = trades.find(x => x.id === cmpId); if (!t) return;
  const prev = t[side + 'Img'];
  t[side + 'Img'] = data;
  try { save(); } catch (err) { t[side + 'Img'] = prev; alert(T('alertStorage')); return; }
  openCompare(cmpId); setTarget(side);
}
$('#cmp').addEventListener('click', e => {
  const b = e.target.closest('[data-cmp]');
  if (b) {
    setTarget(b.dataset.side);
    if (b.dataset.cmp === 'upload') $('#cmpFile').click();
    if (b.dataset.cmp === 'clear') setImg(b.dataset.side, null);
    return;
  }
  const p = e.target.closest('.pane[data-side]');
  if (p && !e.target.closest('a,iframe')) setTarget(p.dataset.side);
});
$('#cmpFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !activeSide) return;
  try { await setImg(activeSide, await toDataURL(f)); } catch (err) { alert(T('alertRead')); }
};
document.addEventListener('paste', async e => {
  if ($('#cmp').classList.contains('hidden') || !activeSide) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  try { await setImg(activeSide, await toDataURL(item.getAsFile())); } catch (err) { alert(T('alertRead')); }
});
$('#cmpClose').onclick = closeCompare;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#cmp').classList.contains('hidden')) closeCompare(); });

/* ===== Events ===== */
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f;
  if (!f) return;
  const t = trades.find(x => x.id === +el.dataset.id);
  if (!t) return;
  if (f === 'addemo') {
    let v = el.value;
    if (v === '__new') { v = (prompt(T('newEmo')) || '').trim(); if (v && !emotions.includes(v)) emotions.push(v); }
    if (v && !t.emotions.includes(v)) t.emotions.push(v);
  }
  else if (f === 'strategy') t.strategy = el.value.split(',').map(s => s.trim()).filter(Boolean);
  else if (f === 'risk') t.risk = Math.max(0, +el.value || 0);
  else if (f === 'rr') t.rr = Math.max(0, +el.value || 0);
  else if (f === 'override') {
    const v = parseUSD(el.value);
    if (el.value.trim() !== '' && v === null) { alert(T('alertAmount')); render(); return; }
    t.override = v; editing.delete(t.id + '|override');
  }
  else if (f === 'beforeChart' || f === 'afterChart') {
    const v = el.value.trim();
    if (v && !/^https?:\/\//i.test(v)) { alert(T('badLink')); render(); return; }
    t[f] = v; editing.delete(t.id + '|' + f);
  }
  else t[f] = el.value;
  save(); render();
});

$('#bal').onchange = e => {
  const v = +e.target.value;
  if (v > 0) { BALANCE = r2(v); save(); render(); }
  else e.target.value = BALANCE;
};

document.addEventListener('click', e => {
  if (e.target.closest('#theme')) { toggleTheme(); return; }
  const lb = e.target.closest('#lang button, .gate-lang button'); if (lb) { setLang(lb.dataset.l); return; }
  if (e.target.closest('#newmonth')) { startMonth(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'drawer') { if (e.target.closest('input,select,textarea,button')) return; drawerId = +a.dataset.id; render(); return; }
  if (act === 'drawerclose') { drawerId = null; render(); return; }
  if (act === 'ptab') { periodMode = a.dataset.m; render(); return; }
  if (act === 'compare') { openCompare(+a.dataset.id); return; }
  if (act === 'edit') { editing.add(a.dataset.key); render(); return; }
  if (act === 'analyze') { auditMonth = a.dataset.m; render(); return; }
  if (act === 'auditclose') { auditMonth = null; render(); return; }
  if (act === 'newtrade') {
    const m = a.dataset.m;
    draft = {date: m === CUR ? TODAY : m + '-01', pair: '', side: null, outcome: null, risk: '', rr: '', pnl: '', tf: '', strategy: '', emotions: [], note: '', beforeChart: '', afterChart: ''};
    drawerId = null; render(); return;
  }
  if (act === 'pro-risk') { proModal = 'risk'; render(); return; }
  if (act === 'pro-check') { proModal = 'check'; render(); return; }
  if (act === 'pm-close') { proModal = null; render(); return; }
  if (act === 'lg') { lineVis[a.dataset.v] = !lineVis[a.dataset.v]; render(); return; }
  if (act === 'dr-side') { if (draft) { draft.side = a.dataset.v; render(); } return; }
  if (act === 'dr-out') { if (draft) { draft.outcome = a.dataset.v; render(); } return; }
  if (act === 'dr-emo') { if (draft) { const v = a.dataset.v; draft.emotions = draft.emotions.includes(v) ? draft.emotions.filter(x => x !== v) : [...draft.emotions, v]; render(); } return; }
  if (act === 'dr-save') { saveDraft(); return; }
  if (act === 'dr-cancel') { draft = null; render(); return; }
  const t = trades.find(x => x.id === +a.dataset.id);
  if (act === 'side' && t) t.side = t.side === 'L' ? 'S' : 'L';
  else if (act === 'del' && t && confirm(T('confirmDel'))) trades = trades.filter(x => x.id !== t.id);
  else if (act === 'rmemo' && t) t.emotions = t.emotions.filter(x => x !== a.dataset.v);
  else return;
  save(); render();
});

/* ===== Strict 1H Spot SMC Uptrend Scanner: live Bybit (OKX backup) data only; no placeholder coins ===== */
let scanStatus = 'loading', scanResults = [];
const SCAN_STABLE = /^(USDC|DAI|FDUSD|TUSD|USDD|USDE|PYUSD|BUSD|EUR|GBP|USDP|XUSD)$/;
const SCAN_LEVERAGED = /(3L|3S|5L|5S|2L|2S|UP|DOWN|BULL|BEAR)$/;
async function getJSON(url) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(url, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);

  } finally { clearTimeout(timer); }
}
// Liquidity universe: all active USDT spot pairs sorted by 24h turnover (Bybit first, OKX backup)
async function loadUniverse() {
  try {
    const j = await getJSON('https://api.bybit.com/v5/market/tickers?category=spot');
    if (j.retCode !== 0) throw new Error('bybit');
    return {src: 'bybit', list: j.result.list.filter(x => x.symbol.endsWith('USDT'))
      .map(x => ({base: x.symbol.slice(0, -4), vol: +x.turnover24h}))};
  } catch (e) {}

  if (j.code !== '0') throw new Error('okx');

    .map(x => ({base: x.instId.split('-')[0], vol: +x.volCcy24h}))};
}
// Oldest -> newest. The newest candle returned by both exchanges is still forming.
async function fetchCandles(src, base) {
  if (src === 'bybit') {
    const j = await getJSON('https://api.bybit.com/v5/market/kline?category=spot&symbol=' + base + 'USDT&interval=60&limit=220');
    if (j.retCode !== 0) throw new Error('bybit kline');
    return j.result.list.map(k => ({o: +k[1], h: +k[2], l: +k[3], c: +k[4]})).reverse();
  }
  const j = await getJSON('https://www.okx.com/api/v5/market/candles?instId=' + base + '-USDT&bar=1H&limit=220');
  if (j.code !== '0') throw new Error('okx kline');
  return j.data.map(k => ({o: +k[1], h: +k[2], l: +k[3], c: +k[4]})).reverse();
}
function emaOf(vals, p) {
  const k = 2 / (p + 1);
  let e = vals.slice(0, p).reduce((a, b) => a + b, 0) / p;
  for (let i = p; i < vals.length; i++) e = vals[i] * k + e * (1 - k);
  return e;
}
// Swing points (fractals): highest high / lowest low of L candles on each side
function swingPoints(c, L) {
  const hi = [], lo = [];
  for (let i = L; i < c.length - L; i++) {
    let isH = true, isL = true;
    for (let j = i - L; j <= i + L; j++) {
      if (j === i) continue;
      if (c[j].h >= c[i].h) isH = false;
      if (c[j].l <= c[i].l) isL = false;
    }
    if (isH) hi.push({i, p: c[i].h});
    if (isL) lo.push({i, p: c[i].l});
  }
  return {hi, lo};
}
// Returns a result only if ALL rules pass; otherwise null
function analyzeCoin(c, price) {
  const n = c.length;
  if (n < 210) return null;
  // Rule A: strict uptrend
  const e50 = emaOf(c.map(k => k.c), 50), e200 = emaOf(c.map(k => k.c), 200);
  if (!(price > e50 && price > e200)) return null;
  const {hi, lo} = swingPoints(c, 3);
  if (hi.length < 2 || lo.length < 2) return null;
  const [h1, h2] = hi.slice(-2), [l1, l2] = lo.slice(-2);
  if (!(h2.p > h1.p && l2.p > l1.p)) return null;
  // Rule B: impulse of at least +3%, price pulled back to the 50%–78.6% discount zone, swing low not broken
  const H0 = hi[hi.length - 1];
  const lowsBefore = lo.filter(l => l.i < H0.i && l.i >= H0.i - 100);
  if (!lowsBefore.length) return null;
  const L0 = lowsBefore.reduce((a, b) => (b.p < a.p ? b : a));
  const range = H0.p - L0.p, imp = range / L0.p;
  if (imp < 0.03) return null;
  const retr = (H0.p - price) / range;
  if (!(retr >= 0.5 && retr <= 0.786)) return null;
  const after = c.slice(H0.i + 1);
  if (!after.length) return null;
  const pbLow = Math.min(...after.map(k => k.l));
  if (pbLow <= L0.p) return null;
  // Rule C: a minor low inside the discount zone was swept, and the latest closed candle is green
  const zoneLow = H0.p - range * 0.786, zoneHigh = H0.p - range * 0.5;
  const IL = lo.find(l => l.i > H0.i && l.p >= zoneLow && l.p <= zoneHigh);
  if (!IL) return null;
  const swept = pbLow < IL.p;
  const last = c[n - 1];
  if (!(swept && last.c > last.o)) return null;
  // Confluence score (60–100): base for passing every rule + impulse size + Fib 61.8 proximity + trend strength + sweep depth
  const impS = Math.min(imp / 0.08, 1) * 10;
  const fibS = (1 - Math.min(Math.abs(retr - 0.618) / 0.118, 1)) * 10;
  const trendS = Math.min((price - e200) / e200 / 0.05, 1) * 10;
  const sweepS = Math.min((IL.p - pbLow) / IL.p / 0.01, 1) * 10;
  return {price, score: Math.round(60 + impS + fibS + trendS + sweepS)};
}
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  const workers = Array.from({length: limit}, async () => {
    while (next < items.length) {
      const idx = next++;
      try { out[idx] = await fn(items[idx]); } catch (e) { out[idx] = null; }
    }
  });
  await Promise.all(workers);
  return out;
}
async function runScan() {
  scanStatus = 'loading'; scanResults = [];
  let uni = null;
  try { uni = await loadUniverse(); } catch (e) { uni = null; }
  if (!uni) { scanStatus = 'offline'; renderScanner(); return; }
  const coins = uni.list
    .filter(x => x.base && !SCAN_STABLE.test(x.base) && !SCAN_LEVERAGED.test(x.base) && x.vol > 0)
    .sort((a, b) => b.vol - a.vol);
  const top = coins.slice(0, Math.ceil(coins.length / 2));   // Top 50% most liquid
  let answered = 0;
  const res = await mapLimit(top, 8, async coin => {
    const arr = await fetchCandles(uni.src, coin.base);
    answered++;
    const closed = arr.slice(0, -1), price = arr[arr.length - 1].c;
    const r = analyzeCoin(closed, price);
    return r ? {...r, base: coin.base} : null;
  });
  if (answered === 0) { scanStatus = 'offline'; renderScanner(); return; }
  scanResults = res.filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 10);
  scanStatus = 'done';
  renderScanner();
}
function fmtPrice(v) {
  return '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: v < 1 ? 6 : 2});
}
// Shows only verified coins. Offline or no-match states show one muted pill and never fake coins.
function renderScanner() {
  const el = document.getElementById('scanner'); if (!el) return;
  if (scanStatus === 'offline') { el.innerHTML = `<div class="sc-pill">${esc(T('scPill'))}</div>`; return; }
  if (scanStatus !== 'done') { el.innerHTML = ''; return; }
  if (!scanResults.length) { el.innerHTML = `<div class="sc-pill">${esc(T('scNone'))}</div>`; return; }
  el.innerHTML = '<div class="sc-row-h">' + scanResults.map(r =>
    `<a class="card mini" href="https://tradingview.com" target="_blank" rel="noopener"><b>${esc(r.base)}/USDT</b><span class="mv">${r.score}%</span><span class="mp">${esc(fmtPrice(r.price))}</span></a>`
  ).join('') + '</div>';
}

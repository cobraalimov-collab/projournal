const r2 = x => Math.round(x * 100) / 100;
// Risk-based: risk $ = balance x risk% ; TP = +risk$ x R:R ; SL = -risk$ ; manual $ override wins
function pnl(t) {
  if (t.override !== null && t.override !== undefined && t.override !== '') return r2(+t.override);
  const riskUSD = BALANCE * (t.risk || 0) / 100;
  if (t.outcome === 'tp') return r2(riskUSD * t.rr);
  if (t.outcome === 'sl') return r2(-riskUSD);
  return 0;
}
const fmt = x => {
  const s = Math.abs(x).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  return (x > 0 ? '+' : x < 0 ? '-' : '') + '$' + s;
};
// Accepts "+$150", "-50", "1,200.5", or empty (empty = clear the manual override)
const parseUSD = s => { const v = String(s ?? '').replace(/[$,\s]/g, '').replace(/^\+/, ''); return v === '' || isNaN(+v) ? null : r2(+v); };
const sortTrades = a => a.sort((x, y) => x.date.localeCompare(y.date) || x.id - y.id);
const ymAdd = (ym, k) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
// Oldest first (top) -> newest last (bottom)
function allMonths() {
  const s = new Set([...months, ...trades.map(t => t.date.slice(0, 7))]);
  if (!s.size) s.add(CUR);
  return [...s].sort();
}
function startMonth() {
  const all = allMonths();
  let next = ymAdd(all[all.length - 1], 1);
  if (next < CUR) next = CUR;
  if (!months.includes(next) && !trades.some(t => t.date.slice(0, 7) === next)) months.push(next);
  save(); render();
}

function smoothPath(P) {
  if (P.length < 2) return '';
  let d = 'M' + P[0][0].toFixed(1) + ',' + P[0][1].toFixed(1);
  for (let i = 0; i < P.length - 1; i++) {
    const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2, k = 0.18;
    const c1x = p1[0] + (p2[0] - p0[0]) * k, c1y = p1[1] + (p2[1] - p0[1]) * k;
    const c2x = p2[0] - (p3[0] - p1[0]) * k, c2y = p2[1] - (p3[1] - p1[1]) * k;
    d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ',' + p2[1].toFixed(1);
  }
  return d;
}
function lineChart(f, title, kind) {
  const W = 520, H = 220, TOP = 16, BOT = 170, P = 26, GREEN = '#16C784', RED = '#EA3943';
  const n = f.length, id = 'c' + (++chartUid);

  let c = 0;
  const vals = [0, ...f.map(t => c = r2(c + pnl(t)))];
  const mn = Math.min(0, ...vals), mx = Math.max(0, ...vals), span = (mx - mn) || 1;
  const X = i => P + i * (W - 2 * P) / Math.max(1, n);
  const Y = v => TOP + (mx - v) / span * (BOT - TOP);
  const zo = Math.min(1, Math.max(0, (Y(0) - TOP) / (BOT - TOP)));
  const pts = vals.map((v, i) => [X(i), Y(v)]);
  const line = smoothPath(pts);
  const area = line + ' L' + X(n).toFixed(1) + ',' + Y(0).toFixed(1) + ' L' + X(0).toFixed(1) + ',' + Y(0).toFixed(1) + ' Z';

    <linearGradient id="s${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${TOP}" x2="0" y2="${BOT}"><stop offset="0" stop-color="${GREEN}"/><stop offset="${zo}" stop-color="${GREEN}"/><stop offset="${zo}" stop-color="${RED}"/><stop offset="1" stop-color="${RED}"/></linearGradient>
  </defs>`;
  const dots = f.map((t, i) => {

    const label = kind === 'pnl'

    return `<g class="pt" ${tipAttrs}><circle cx="${x}" cy="${y}" r="9" fill="transparent"/><circle cx="${x}" cy="${y}" r="4" fill="${col}"/></g>` + label;
  }).join('');
  return `<div class="card"><b>${esc(title)}</b><svg viewBox="0 0 ${W} ${H}">${defs}
    <line x1="${P}" x2="${W - P}" y1="${Y(0)}" y2="${Y(0)}" stroke-dasharray="4" style="stroke:var(--zero)"/>

/* ===== Monthly AI audit (rule-based, this month only, USD) ===== */
function audit(f) {
  const box = (L, tilt) => `<div class="card audit">${tilt ? `<div class="tilt">${esc(T('tilt'))}</div>` : ''}<b>${esc(T('auditTitle'))}</b><ul>${L.map(([c, s]) => `<li class="${c}">${s}</li>`).join('')}</ul></div>`;
  if (!f.length) return box([['', esc(T('noData'))]], false);
  const L = [];
  const losses = f.filter(t => t.outcome === 'sl');
  if (!losses.length) L.push(['good', esc(T('noLoss'))]);

  const em = {};
  losses.forEach(t => (t.emotions.length ? t.emotions : ['—']).forEach(e => {
    const o = em[e] || (em[e] = {n: 0, p: 0}); o.n++; o.p = r2(o.p + pnl(t));
  }));
  Object.entries(em).sort((a, b) => a[1].p - b[1].p).slice(0, 2)
    .forEach(([e, o]) => L.push(['warn', esc(T('emoLoss')(EMO(e), o.n, fmt(o.p)))]));

  // Win rate per pair: TP / (TP + SL), combining all timeframes of that pair
  const pr = {};
  f.forEach(t => {
    const o = pr[t.pair] || (pr[t.pair] = {w: 0, l: 0, tfs: {}});
    if (t.outcome === 'tp') o.w++;
    if (t.outcome === 'sl') { o.l++; o.tfs[t.tf] = (o.tfs[t.tf] || 0) + 1; }
  });
  const worst = Object.entries(pr).filter(([, o]) => o.l > 0)
    .map(([p, o]) => ({pair: p, wr: o.w / (o.w + o.l) * 100, l: o.l,
      tf: (Object.entries(o.tfs).sort((a, b) => b[1] - a[1])[0] || ['—'])[0] || '—'}))
    .sort((a, b) => a.wr - b.wr || b.l - a.l)[0];
  if (worst) L.push(['warn', esc(T('worst')(pairRaw(worst.pair), worst.tf, worst.wr.toFixed(0)))]);

  const avg = f.reduce((a, t) => a + t.risk, 0) / f.length;
  const hi = f.filter(t => t.risk > avg).length;
  if (hi) L.push(['warn', esc(T('riskHi')(hi, avg.toFixed(2)))]);
  const days = {};
  f.forEach(t => { const d = days[t.date] || (days[t.date] = {r: 0, m: 0}); d.r = t.outcome === 'sl' ? d.r + 1 : 0; d.m = Math.max(d.m, d.r); });
  Object.entries(days).filter(([, d]) => d.m >= 2)
    .forEach(([d, v]) => L.push(['warn', esc(T('revenge')(d, v.m))]));

  const combo = {};
  f.forEach(t => t.emotions.forEach(e => t.strategy.forEach(s => {
    const k = e + '\u0001' + s; combo[k] = r2((combo[k] || 0) + pnl(t));
  })));
  const bc = Object.entries(combo).sort((a, b) => b[1] - a[1])[0];
  if (bc && bc[1] > 0) { const [e, s] = bc[0].split('\u0001'); L.push(['good', esc(T('best')(EMO(e), s, fmt(bc[1])))]); }
  const bp = {};
  f.forEach(t => bp[t.pair] = r2((bp[t.pair] || 0) + pnl(t)));
  const bpE = Object.entries(bp).sort((a, b) => b[1] - a[1])[0];
  if (bpE) L.push([bpE[1] >= 0 ? 'good' : 'warn', esc(T('bestPair')(pairRaw(bpE[0]), fmt(bpE[1])))]);

  // Tilt: 2+ consecutive stop-losses, or any FOMO / Greed trade
  let run = 0, maxRun = 0;
  [...f].sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id).forEach(t => { run = t.outcome === 'sl' ? run + 1 : 0; maxRun = Math.max(maxRun, run); });
  const emoHit = f.filter(t => t.emotions.some(e => /FOMO|Greedy/.test(e))).length;
  return box(L, maxRun >= 2 || emoHit > 0);
}

      <label class="full">${esc(T('cStrat'))}<input data-id="${t.id}" data-f="strategy" value="${esc(t.strategy.join(', '))}" placeholder="${esc(T('strategyPh'))}"></label>
    </div>
    <div class="dr-links">
      ${open('beforeChart', T('cBefore'))}
      <input data-id="${t.id}" data-f="beforeChart" value="${esc(t.beforeChart)}" placeholder="${esc(T('paste'))}">
      ${open('afterChart', T('cAfter'))}
      <input data-id="${t.id}" data-f="afterChart" value="${esc(t.afterChart)}" placeholder="${esc(T('paste'))}">
    </div>
    <div class="dr-emo">${t.emotions.map(e => `<span class="tag">${esc(EMO(e))}<span class="x" data-act="rmemo" data-id="${t.id}" data-v="${esc(e)}">×</span></span>`).join('')}
      <select data-id="${t.id}" data-f="addemo"><option value="">${esc(T('addEmo'))}</option>${emoOpts}<option value="__new">${esc(T('customEmo'))}</option></select></div>
    <div class="dr-actions"><button class="p" data-act="compare" data-id="${t.id}">📊 Chart view</button><button class="dr-del" data-act="del" data-id="${t.id}">${esc(T('del'))}</button></div>
  </aside>`;
}
function traderScore(all, wr, avgRR) {
  if (!all.length) return 0;
  const disc = Math.min(avgRR / 2, 1) * 100;
  const bad = all.filter(t => t.emotions.some(e => /FOMO|Greedy/.test(e))).length;
  const emo = (1 - bad / all.length) * 100;
  return Math.max(0, Math.min(100, Math.round(0.5 * wr + 0.25 * disc + 0.25 * emo)));
}
function heroHTML() {
  const net = r2(trades.reduce((a, t) => a + pnl(t), 0));
  const wins = trades.filter(t => t.outcome === 'tp').length, losses = trades.filter(t => t.outcome === 'sl').length;
  const wr = wins + losses ? wins / (wins + losses) * 100 : 0;
  const avgRR = trades.length ? trades.reduce((a, t) => a + (+t.rr || 0), 0) / trades.length : 0;
  const score = traderScore(trades, wr, avgRR);
  const card = (label, val, cls = '') => `<div class="card hk"><span>${esc(label)}</span><b class="${cls}">${val}</b></div>`;
  const C = 113.1, ring = `<svg class="ring" viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="18" stroke="#222531" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="18" stroke="#3861FB" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${(score * C / 100).toFixed(1)} ${C}" transform="rotate(-90 22 22)"/><text x="22" y="26" text-anchor="middle" font-size="12" fill="#FFFFFF">${score}</text></svg>`;
  return card(T('balance'), '$' + BALANCE.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}))
    + card(T('kNet'), esc(fmt(net)), net >= 0 ? 'pos' : 'neg')
    + card(T('kWin'), wr.toFixed(1) + '%')
    + card('Avg R:R', '1:' + avgRR.toFixed(2))
    + `<div class="card hk score"><div><span>Trader Score</span><br><b style="font-size:16px">${score}/100</b></div>${ring}</div>`;
}
function periodCard() {
  const g = group(periodMode === 'm' ? t => t.date.slice(0, 7) : t => t.date.slice(0, 4));
  return `<div class="card"><div class="bar" style="justify-content:space-between"><b>${esc(periodMode === 'm' ? T('monthly') : T('annual'))}</b>
    <div class="ptabs"><button class="${periodMode === 'm' ? 'on' : ''}" data-act="ptab" data-m="m">${esc(T('monthly'))}</button><button class="${periodMode === 'y' ? 'on' : ''}" data-act="ptab" data-m="y">${esc(T('annual'))}</button></div></div>
    <table style="table-layout:auto;margin-top:6px"><tr><th>${esc(T('period'))}</th><th>${esc(T('cTrades'))}</th><th>${esc(T('cPnl'))}</th></tr>
    ${g.map(([k, v]) => `<tr><td>${k}</td><td>${v.n}</td><td class="${v.p >= 0 ? 'pos' : 'neg'}">${esc(fmt(v.p))}</td></tr>`).join('')}</table></div>`;
}
function calHTML(m, f) {
  const [y, mo] = m.split('-').map(Number), days = new Date(y, mo, 0).getDate();
  const first = (new Date(y, mo - 1, 1).getDay() + 6) % 7;
  const by = {};
  f.forEach(t => { const d = +t.date.slice(8, 10); const o = by[d] || (by[d] = {p: 0, n: 0}); o.p = r2(o.p + pnl(t)); o.n++; });
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const o = by[d], cls = !o ? 'cal' : o.p > 0 ? 'cal win' : o.p < 0 ? 'cal loss' : 'cal';
    cells += `<div class="${cls}"><span class="dn">${d}</span>${o ? `<b class="${o.p >= 0 ? 'pos' : 'neg'}">${esc(fmt(o.p))}</b><small>${o.n} ${esc(T('cTrades').toLowerCase())}</small>` : ''}</div>`;
  }
  return `<div class="calgrid">${['Mo','Tu','We','Th','Fr','Sa','Su'].map(w => `<div class="wd">${w}</div>`).join('')}${cells}</div>`;
}

/* ===== One isolated monthly block ===== */
function block(m) {
  const f = sortTrades(trades.filter(t => t.date.slice(0, 7) === m));
  const n = f.length, wins = f.filter(t => t.outcome === 'tp').length, losses = f.filter(t => t.outcome === 'sl').length;
  const net = r2(f.reduce((a, t) => a + pnl(t), 0));
  const avgR = n ? f.reduce((a, t) => a + pnl(t) / (BALANCE * (t.risk || 1) / 100 || 1), 0) / n : 0;
  const wr = wins + losses ? wins / (wins + losses) * 100 : 0;
  const highlighted = m < CUR || hl.has(m);
  return `<section class="card${highlighted ? ' hl' : ''}">
    <div class="bar" style="justify-content:space-between">
      <h2>${esc(monthName(m))}</h2>
      <div class="bar">
        ${m < CUR ? `<span class="done">${esc(T('done'))}</span>` : ''}
        <button data-act="analyze" data-m="${m}">${esc(T('analyze'))}</button>
        <button class="p" data-act="newtrade" data-m="${m}">${esc(T('newTrade'))}</button>
      </div>
    </div>
    <div class="kpis">
      <div>${esc(T('kTrades'))}<b>${n}</b></div>
      <div>${esc(T('kWin'))}<b>${wr.toFixed(1)}%</b></div>
      <div>${esc(T('kNet'))}<b class="${net >= 0 ? 'pos' : 'neg'}">${esc(fmt(net))}</b></div>
      <div>${esc(T('kAvg'))}<b>${avgR.toFixed(2)}R</b></div>
    </div>
    <div class="charts">${charts(f)}</div>
    ${audit(f)}
    ${calHTML(m, f)}
    <div class="tw"><table class="ctab">
      <thead><tr>
        <th class="stk">${esc(T('cPair'))}</th><th>${esc(T('cSide'))}</th><th class="num">${esc(T('cPnl'))}</th><th>${esc(T('cOut'))}</th>
        <th class="num">${esc(T('cRisk'))}</th><th class="num">${esc(T('cRR'))}</th><th>${esc(T('cTf'))}</th><th>${esc(T('cEmo'))}</th>
      </tr></thead>
      <tbody>${f.map(rowHTML).join('') || `<tr><td colspan="8" class="sub" style="padding:16px">${esc(T('noRows'))}</td></tr>`}</tbody>
    </table></div>
  </section>`;
}

/* ===== Monthly & annual summaries (USD) ===== */
function group(fn) {
  const m = {};
  trades.forEach(t => { const k = fn(t); const o = m[k] || (m[k] = {n: 0, p: 0}); o.n++; o.p = r2(o.p + pnl(t)); });
  return Object.entries(m).sort();
}
function periodTable(title, g) {
  return `<div class="card"><b>${esc(title)}</b><table style="table-layout:auto;margin-top:6px">
    <tr><th>${esc(T('period'))}</th><th>${esc(T('cTrades'))}</th><th>${esc(T('cPnl'))}</th></tr>
    ${g.map(([k, v]) => `<tr><td>${k}</td><td>${v.n}</td><td class="${v.p >= 0 ? 'pos' : 'neg'}">${fmt(v.p)}</td></tr>`).join('')}</table></div>`;
}

function render() {
  $('#hero').innerHTML = heroHTML();
  $('#periods').innerHTML = periodCard();
  $('#drawer').innerHTML = drawerHTML();
  $('#months').innerHTML = allMonths().map(block).join('');
  $('#lang').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('#bal').value = BALANCE;
}

/* ===== Static labels, language, theme ===== */
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(el => el.textContent = T(el.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = T(el.dataset.ph));
}
function setLang(l) {
  if (!I18N[l]) return;
  lang = l; store.setItem('bcpj_lang', l);
  applyStatic(); render();
}
const MOON = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function applyTheme() { document.documentElement.dataset.theme = theme; $('#theme').innerHTML = theme === 'dark' ? MOON : SUN; }
function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; store.setItem('bcpj_theme', theme); applyTheme(); }

/* ===== Split-screen chart comparison (view only; does not change data) ===== */
const BEFORE_LABEL = 'BEFORE (OLDIN / DO) — Entry';
const AFTER_LABEL = 'AFTER (KEYIN / POSLE) — Result (TP / SL)';
// TradingView snapshot (tradingview.com/x/ID/) -> direct PNG; direct image URLs pass through; anything else is an iframe
function snapImage(url) {
  const m = url.match(/tradingview\.com\/x\/([A-Za-z0-9]+)/i);
  if (m) return `https://s3.tradingview.com/${m[1][0].toLowerCase()}/${m[1]}.png`;
  return /\.(png|jpe?g|gif|webp)(\?.*)?$/i.test(url) ? url : null;
}
// Each panel: uploaded/pasted image (stored locally) > TradingView snapshot PNG > TradingView chart widget for the pair
// Preview for regular chart links: webpage screenshot service (external, so it can be blocked in some sandboxes)
const PREVIEW_BASE = 'https://image.thum.io/get/width/1200/crop/800/';
function previewUrl(url) { return snapImage(url) || (PREVIEW_BASE + encodeURIComponent(url)); }
const TV_INTERVAL = {'15m':'15','1H':'60','4H':'240','1D':'D'};
function widgetView(t) {
  const src = 'https://s.tradingview.com/widgetembed/?symbol=' + encodeURIComponent('BINANCE:' + t.pair) +
    '&interval=' + (TV_INTERVAL[t.tf] || '60') + '&theme=dark&style=1&locale=en';
  return `<iframe class="frame" src="${esc(src)}" referrerpolicy="no-referrer-when-downgrade" title="TradingView ${esc(t.pair)}"></iframe>`;
}
function imgView(src) { return `<div class="imgwrap"><img src="${esc(src)}" alt=""></div>`; }
function paneHTML(side, label, t, url) {
  const img = t[side + 'Img'];
  const open = url ? `<a class="open" href="${safeUrl(url)}" target="_blank" rel="noopener">Open in TradingView ↗</a>` : '';
  const acts = `<div class="paneact"><button data-cmp="upload" data-side="${side}">⬆ Upload / Paste</button>${img ? `<button data-cmp="clear" data-side="${side}">✕ Remove</button>` : ''}<span class="hint">Click panel, then Ctrl+V</span></div>`;
  let view;
  if (img) view = imgView(img);
  else if (!url) view = `<div class="ph">No TradingView link added</div>`;
  else if (snapImage(url)) view = `<div class="imgwrap"><img class="snap" src="${esc(snapImage(url))}" alt=""></div>`;
  else view = `<div class="imgwrap"><img class="snap" src="${esc(previewUrl(url))}" alt=""></div>`;
  return `<div class="pane" data-side="${side}"><div class="plabel">${esc(label)}</div>${open}${view}${acts}</div>`;
}
function openCompare(id) {
  const t = trades.find(x => x.id === id); if (!t) return;
  const p = pnl(t);
  cmpId = id; setTarget(null);
  $('#cmpPair').textContent = t.pair;
  $('#cmpSide').innerHTML = `<button class="${t.side}" style="cursor:default">${t.side === 'L' ? esc(T('long')) : esc(T('short'))}</button>`;
  $('#cmpRisk').textContent = t.risk + '%';
  $('#cmpRR').textContent = '1:' + t.rr;
  $('#cmpPnl').innerHTML = `<span class="${p >= 0 ? 'pos' : 'neg'}">${fmt(p)}</span>`;
  $('#cmpBody').innerHTML = paneHTML('before', BEFORE_LABEL, t, t.beforeChart) + paneHTML('after', AFTER_LABEL, t, t.afterChart);
  $('#cmpBody').querySelectorAll('img.snap').forEach(im => im.onerror = () => { im.parentElement.outerHTML = widgetView(t) + '<div class="cnote">Note: External images are blocked in Claude preview — open the published app in a browser tab to view your exact link snapshot.</div>'; });
  $('#cmpBody').querySelectorAll('.imgwrap').forEach(w => w.onclick = () => w.classList.toggle('z'));
  $('#cmp').classList.remove('hidden');
}
function closeCompare() { $('#cmp').classList.add('hidden'); $('#cmpBody').innerHTML = ''; }
let cmpId = null, activeSide = null;
function setTarget(side) {
  activeSide = side;
  $('#cmpTarget').textContent = side ? 'Paste target: ' + side.toUpperCase() : 'Click a panel, then Ctrl+V';
  document.querySelectorAll('#cmp .pane').forEach(p => p.classList.toggle('act', p.dataset.side === side));
}
// Resize to max 1600px and compress to JPEG so images fit in localStorage
function toDataURL(file) {
  return new Promise((res, rej) => {
    const src = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(src); rej(new Error('image')); };
    img.src = src;
  });
}
async function setImg(side, data) {
  const t = trades.find(x => x.id === cmpId); if (!t) return;
  const prev = t[side + 'Img'];
  t[side + 'Img'] = data;
  try { save(); } catch (err) { t[side + 'Img'] = prev; alert('Browser storage is full. Remove an image or export and clear older data.'); return; }
  openCompare(cmpId); setTarget(side);
}
$('#cmp').addEventListener('click', e => {
  const b = e.target.closest('[data-cmp]');
  if (b) {
    setTarget(b.dataset.side);
    if (b.dataset.cmp === 'upload') $('#cmpFile').click();
    if (b.dataset.cmp === 'clear') setImg(b.dataset.side, null);
    return;
  }
  const p = e.target.closest('.pane[data-side]');
  if (p && !e.target.closest('a,iframe')) setTarget(p.dataset.side);
});
$('#cmpFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !activeSide) return;
  try { await setImg(activeSide, await toDataURL(f)); } catch (err) { alert('Could not read that image.'); }
};
document.addEventListener('paste', async e => {
  if ($('#cmp').classList.contains('hidden') || !activeSide) return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  try { await setImg(activeSide, await toDataURL(item.getAsFile())); } catch (err) { alert('Could not read that image.'); }
});
$('#cmpClose').onclick = closeCompare;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#cmp').classList.contains('hidden')) closeCompare(); });

/* ===== Events ===== */
document.addEventListener('change', e => {
  const el = e.target, f = el.dataset.f;
  if (!f) return;
  const t = trades.find(x => x.id === +el.dataset.id);
  if (!t) return;
  if (f === 'addemo') {
    let v = el.value;
    if (v === '__new') { v = (prompt(T('newEmo')) || '').trim(); if (v && !emotions.includes(v)) emotions.push(v); }
    if (v && !t.emotions.includes(v)) t.emotions.push(v);
  }
  else if (f === 'strategy') t.strategy = el.value.split(',').map(s => s.trim()).filter(Boolean);
  else if (f === 'risk') t.risk = Math.max(0, +el.value || 0);
  else if (f === 'rr') t.rr = Math.max(0, +el.value || 0);
  else if (f === 'override') {
    const v = parseUSD(el.value);
    if (el.value.trim() !== '' && v === null) { alert('$'); render(); return; }
    t.override = v; editing.delete(t.id + '|override');
  }
  else if (f === 'beforeChart' || f === 'afterChart') {
    const v = el.value.trim();
    if (v && !/^https?:\/\//i.test(v)) { alert(T('badLink')); render(); return; }
    t[f] = v; editing.delete(t.id + '|' + f);
  }
  else t[f] = el.value;
  save(); render();
});

$('#bal').onchange = e => {
  const v = +e.target.value;
  if (v > 0) { BALANCE = r2(v); save(); render(); }
  else e.target.value = BALANCE;
};

document.addEventListener('click', e => {
  if (e.target.closest('#theme')) { toggleTheme(); return; }
  const lb = e.target.closest('#lang button'); if (lb) { setLang(lb.dataset.l); return; }
  if (e.target.closest('#newmonth')) { startMonth(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'drawer') { if (e.target.closest('input,select,textarea,button')) return; drawerId = +a.dataset.id; render(); return; }
  if (act === 'drawerclose') { drawerId = null; render(); return; }
  if (act === 'ptab') { periodMode = a.dataset.m; render(); return; }
  if (act === 'compare') { openCompare(+a.dataset.id); return; }
  if (act === 'edit') { editing.add(a.dataset.key); render(); return; }
  if (act === 'analyze') { const m = a.dataset.m; hl.has(m) ? hl.delete(m) : hl.add(m); render(); return; }
  if (act === 'newtrade') { const m = a.dataset.m; trades.push(newTrade(m === CUR ? TODAY : m + '-01')); save(); render(); return; }
  const t = trades.find(x => x.id === +a.dataset.id);
  if (act === 'side' && t) t.side = t.side === 'L' ? 'S' : 'L';
  else if (act === 'del' && t && confirm(T('confirmDel'))) trades = trades.filter(x => x.id !== t.id);
  else if (act === 'rmemo' && t) t.emotions = t.emotions.filter(x => x !== a.dataset.v);
  else return;
  save(); render();
});

$('#exp').onclick = () => {
  const blob = new Blob([JSON.stringify({version: 4, balance: BALANCE, trades, emotions, months}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'behruz-journal-' + TODAY + '.json';
  a.click();
};
$('#imp').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result), incoming = Array.isArray(d) ? d : d.trades;
      if (!Array.isArray(incoming)) throw new Error();
      const ids = new Set(trades.map(t => t.id));
      incoming.forEach(t => { if (!ids.has(t.id)) trades.push(t); });
      if (d.emotions) emotions = [...new Set([...emotions, ...d.emotions])];
      if (d.months) months = [...new Set([...months, ...d.months])];
      if (d.balance > 0) BALANCE = r2(+d.balance);
      save(); render();
    } catch (err) { alert(T('badFile')); }
  };
  r.readAsText(file);
  e.target.value = '';
};
